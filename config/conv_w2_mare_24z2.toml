# S110 (C-119 E2, revizuită după C-120; Adrian 13 nov 2026, pașii scriși de supraveghetor 13 nov 17:15): Kronos de 24 de
# straturi DE LA ZERO, pornire corectă (încorporări 0,02), Muon, lot 6 × 16, 52 h (fără restul FineWeb-2: vezi mai jos).
# Copie a config/conv_w2_mare_24n.toml (S100) cu DOAR:
#   - modelul `module.model_gpt_cod:ModelGPTCod` + `abatere_incorporari = 0.02` (C1: pierderea primului lot sub 11, nu ~400);
#   - `nume`, `cale_stare` (dosarul NU există: pornire de la zero), `samanta = 24`;
#   - portul `date` ca în config/conv_w2_mare_24_bucati.toml (DateBucati, lucru/bucati/w2_amestec_be12);
#   - `conversatie` = r2, `fractie_conversatie = 0.05`;
#   - `hrana = ""`, fără `fractie_hrana` (pasul 1e: curățarea de scurgeri a scos 14,74 % din textele restului FineWeb-2,
#     peste pragul de 5 % → FineWeb-ul NU se folosește; amestecul rămâne cel vechi, ~34 % română + 5 % întrebări);
#   - `lot = 6`, `adunare_loturi = 16`, `incalzire_pasi = 6400` (loturi = 400 de pași de optimizator),
#     `durata_scaderii_secunde = 187200` (52 h); (`racire_finala = 0.25`, `fractie_rata_finala = 1.0`, `optimizator = "muon"`
#     erau deja așa în 24n);
#   - `examene_suplimentare = []` (fără fapte / fapte noi / profesor la fiecare oră; româna rămâne, din portul `examen`);
#   - `rata_muon` și `rata_invatare` din proba de rată (pasul 4; config/proba_24z2_a.toml și _b.toml);
#   - `spatiu = { model = { lot = [6] } }`, eticheta și acest antet.
#   python unelte/antrenare_recalcul.py --config config/conv_w2_mare_24z2.toml --ore 52 --pauza 5

[platforma]
# Linie nouă, de la zero: cale_stare nu există la pornire (S110).
nume = "w2_mare_24z2"
director_lucru = "lucru"
buget_antrenare_secunde = 3600
experimente = 3
prag_zgomot = -1.0

[criterii]

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 83
memorie_gpu_max_mb = 7000
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_gpt_cod:ModelGPTCod"
setari = { n_straturi = 24, n_capete = 12, n_emb = 768, context = 512, lot = 6, rata_invatare = 0.0003, rata_care_scade = true, incalzire_pasi = 6400, fractie_rata_finala = 1.0, tokenizer = "bpe", cale_tokenizer = "date/ws/bpe_16384.json", cale_stare = "lucru/w2_mare_24z2/gpt.pt", director_cache = "lucru/cache", samanta = 24, examene_suplimentare = [], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "", conversatie = "lucru/romana_raspunsuri_r2/antrenare.jsonl", fractie_conversatie = 0.05, durata_scaderii_secunde = 187200, adunare_loturi = 16, racire_finala = 0.25, optimizator = "muon", rata_muon = 0.01, abatere_incorporari = 0.02 }

[antrenare_lunga]
eticheta = "S110: Kronos 24 de straturi de la zero, pornire 0,02, Muon, lot 6 × 16, amestecul vechi, 52 h (C-119 E2, C-120)"

[porturi.date]
modul = "module.date_bucati:DateBucati"
setari = { director = "lucru/bucati/w2_amestec_be12", cale_validare = "date/tinystories_r2/validare.txt", cale_tokenizer = "date/ws/bpe_16384.json" }

[porturi.examen]
modul = "module.examen_romana:ExamenRomana"
setari = { caractere = 100000, cu_r1 = false }

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [6] } } }

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
