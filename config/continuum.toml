# CONTINUUM v0: ritmul zilei (docs/CONTINUUM_plan.md, secțiunile 13 și 15).
# Decide ce face Kronos când nimeni nu-i spune. La fiecare ciclu observă, alege o singură nevoie și, dacă nivelul o
# permite, cere lui Kronos un experiment: o configurare existentă sau o unealtă de examene. Nu antrenează și nu dă
# examene singur. Toate pragurile, ferestrele și bugetele sunt aici, nu în cod.
#
#   python -m module.continuum.bucla --config config/continuum.toml --simuleaza   # doar spune ce ar alege și de ce
#   python -m module.continuum.bucla --config config/continuum.toml               # pornește și experimentele
#   python -m module.continuum.bucla --config config/continuum.toml --jurnal      # ultimele cicluri, pe scurt
# Oprire: același buton ca Kronos (lucru/STOP): python -m kronos opreste --config config/proba.toml
# Pornire din nou: python -m kronos porneste --config config/proba.toml

[continuum]
director_lucru = "lucru"               # ca la Kronos: același STOP (lucru/STOP), același jurnal (doar citit)
redescopera_la_cicluri = 6             # la câte cicluri recitește acest fișier și reverifică modulele
jurnal_max_mb = 20                     # peste atât, cicluri.jsonl se mută deoparte și se începe altul
ordinea_nevoilor = ["masoara", "continua", "dezvolta"]   # urgența (secțiunea 4.4): măsurare, învățare, dezvoltare

[guvernator]
fereastra_invatare = "22:00-07:00"     # noaptea: și antrenări lungi (ÎNVĂȚARE)
fereastra_intretinere = "07:00-22:00"  # ziua: examene și hrană de la profesor, fără antrenări (ÎNTREȚINERE)
minute_fara_om = 10                    # omul folosește laptopul dacă a atins tastatura sau mouse-ul mai recent de atât
temperatura_max = 85                   # peste: coboară un nivel (aceeași limită ca paznicul)
memorie_video_libera_min_mb = 4500     # sub atât, placa e ocupată de altceva (profesorul cere ~4.500 MB)
procese_grele = ["python"]             # dacă un astfel de program folosește placa (Kronos, profesorul), e ocupată

[guvernator.pauza_minute]              # cât așteaptă între două cicluri, pe nivel (secțiunea 3)
REPAUS = 10
"ÎNTREȚINERE" = 3
"ÎNVĂȚARE" = 1

[invatare]
incredere_initiala = 0.5               # cu cât pornește o strategie nouă (0–1)
pas_incredere = 0.1                    # cât urcă la SUCCES și cât coboară la EȘEC

# --- Modulele urmărite (ca în configurările Kronos). Descoperite la pornire și la fiecare „redescopera_la_cicluri”
# cicluri. Dacă unul lipsește, nu se încarcă sau spune că a căzut (sanatate(), opțional), capacitățile care depind
# de el devin indisponibile; restul merge mai departe.
[module]
model = "module.model_continuu:ModelGPTContinuu"
examen = "module.examen_bpb:ExamenBpb"
examene_elev = "module.examene_elev"
profesor = "module.profesor_qwen:ProfesorQwen"

# --- Antrenările care contează. Toate dau examenul oficial pe validarea R2, deci scorurile se pot compara între ele.
[linii]
configurari = ["config/laptop_antrenare_lunga*.toml", "config/laptop_fapte*.toml"]

# --- Capacitățile și examenele lor (secțiunea 5). Linia de bază = cel mai bun experiment PĂSTRAT de Kronos.
# Pragurile de zgomot: secțiunea 7 (se reajustează când avem măsurători pe mai multe semințe).
[capacitati.povesti]
metrica = "val_bpb"                    # examenul oficial, din fișa experimentului
mai_mare_e_mai_bine = false
prag_zgomot = 0.02                     # zgomotul dintre semințe, la 8 ore
module = ["model", "examen"]

[capacitati.fapte]
metrica = "fapte_corecte"              # din 150, doar cu cuvântul din fapt
mai_mare_e_mai_bine = true
prag_zgomot = 3
maxim = 150                            # „cea mai slabă capacitate” = cel mai mic procent din maxim
module = ["examene_elev"]
unealta = { linie = "examen_fapte", scor = "corecte_doar_cuvantul_din_fapt" }
masurare = ["{python}", "unelte/examen_fapte.py", "--experiment", "{experiment}"]

[capacitati.sens]
metrica = "nota_profesor"              # media notelor profesorului pe aceleași 20 de povești nevăzute
mai_mare_e_mai_bine = true
prag_zgomot = 0.3
maxim = 10
module = ["profesor"]
unealta = { linie = "examen_profesor", scor = "nota_medie" }
masurare = ["{python}", "unelte/examen_profesor.py", "--experiment", "{experiment}", "--doar-local"]

# --- Hrana: textele noi pe care învață o capacitate (le scrie profesorul).
[hrana.fapte]
dosar = "date/fapte"                   # info.json spune câte povești au rămas
minima_povesti = 5000                  # sub atât, prea puțină pentru o noapte (prima hrană: 7.520 de povești)
comanda = ["{python}", "unelte/genereaza_fapte.py", "--povesti", "{tinta_povesti}", "--ore", "1", "--doar-local"]
adaos_povesti = 2000                   # câte povești în plus cere ziua, când hrana s-a terminat
timeout_ore = 1.5

# --- Nevoile din v0: doar trei (secțiunea 13).
[nevoi.masoara]
# Examenele care lipsesc pe ultimul model păstrat (comanda fiecăruia e la capacitatea lui, „masurare”).
nivel = "ÎNTREȚINERE"                  # ziua sau noaptea, cu placa liberă
timeout_minute = 30                    # pentru fiecare examen

[nevoi.continua]
# Povestirile încă învață: încă o antrenare lungă, cu o configurare existentă și neterminată.
nivel = "ÎNVĂȚARE"                     # doar noaptea
capacitate = "povesti"
castig_minim = 0.005                   # „încă scade” = ultima oră a coborât val_bpb cu cel puțin atât
configurari = ["config/laptop_antrenare_lunga*.toml"]
timeout_ore = 10

[nevoi.dezvolta]
# Cea mai slabă capacitate. Noaptea: antrenare pe hrana ei (o configurare existentă, neterminată, care pomenește
# dosarul hranei). Ziua: hrană nouă de la profesor, doar dacă nu e deja destulă hrană nefolosită.
nivel = "ÎNTREȚINERE"
configurari = ["config/laptop_fapte*.toml"]
timeout_ore = 10

[comenzi]
# Cum pornește o antrenare lungă (o oră = un experiment Kronos). {config}, {ore} și {ultimul_model} se completează
# singure. Fără un model păstrat cu aceeași arhitectură, „--porneste-din” dispare și linia pornește de la zero.
antrenare = ["{python}", "unelte/antrenare_lunga.py", "--config", "{config}", "--ore", "{ore}", "--porneste-din", "{ultimul_model}", "--inceput", "Once upon a time, there was a fearful little dog named Coco"]
