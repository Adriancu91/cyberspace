# Antrenarea lungă, peste noapte (după bucla cinstită): rețeta câștigătoare, cu continuare, 8 ore pe TinyStories de 10×
# (R2). Câte un experiment Kronos pe oră (examenul oficial la final), starea salvată după fiecare examen
# (lucru/antrenare_lunga/gpt.pt). Rata scade singură pe toate cele 8 ore (durata_scaderii_secunde = 8 × 3.600):
# încălzire în primii 100 de pași, apoi cosinus până la 10% din rata de pornire.
# Rețeta câștigătoare a buclei cinstite (4 octombrie 2026): arhitectura din faza 1 (8 straturi × 512, #197), lotul și
# rata din faza 2 (lot 24, rata 0,001, #202). Pornește de la zero.
# Pornește doar cu unealta (ea pune câte o oră pe experiment, cu pauze și răcire între ele):
#   python unelte/antrenare_lunga.py --ore 8      (oprire: python -m kronos opreste --config config/laptop_antrenare_lunga.toml)
#   python unelte/antrenare_lunga.py --raport     (tabelul pe ore și o poveste)

[platforma]
nume = "antrenare_lunga"
director_lucru = "lucru"
buget_antrenare_secunde = 3600   # o oră de antrenare pe experiment (pregătirea nu intră)
experimente = 8
prag_zgomot = 0.005

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 85
memorie_gpu_max_mb = 5500      # din 6 GB, lăsăm loc pentru Windows
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_continuu:ModelGPTContinuu"
setari = { n_straturi = 8, n_capete = 8, n_emb = 512, context = 256, lot = 24, rata_invatare = 0.001, rata_care_scade = true, incalzire_pasi = 100, fractie_rata_finala = 0.1, durata_scaderii_secunde = 28800.0, tokenizer = "bpe", cale_tokenizer = "date/tinystories/bpe_4096.json", cale_stare = "lucru/antrenare_lunga/gpt.pt", director_cache = "lucru/cache", samanta = 0 }

[porturi.date]
modul = "module.date_tinystories:DateTinyStories"
setari = { director = "date/tinystories_r2", megaocteti = 182.0, procent_validare = 0.011, decalaj_antrenare_mo = 18.0, decalaj_validare_mo = 2.0, fara_povestile_din = ["date/tinystories"] }

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [24] } } }   # nu schimbă nimic: rețeta e fixă

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
