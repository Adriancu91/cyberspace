# A patra antrenare lungă (6–7 octombrie 2026): continuare curată, cu toate trei examenele la fiecare oră. Martorul:
# fără poveștile cu fapte ale profesorului, doar TinyStories întreg.
# Continuă modelul 10 × 512 al antrenării a treia (ultimul salvat, experimentul 226: val_bpb 0,4567, 41 de fapte din
# 150, nota profesorului 4,7), lot 24, 8 ore. Rata repornește la 0,0005 și scade pe toate cele 8 ore până la 0,00005
# (încălzire în primii 100 de pași: optimizatorul pornește din nou).
# La fiecare oră: examenul oficial (validarea R2) și, după el, examenele suplimentare (examenul de fapte și nota
# profesorului pe aceleași 20 de povești nevăzute), FĂRĂ [criterii]: doar se măsoară, nu se respinge nimic pentru ele.
#   python unelte/antrenare_lunga.py --config config/laptop_antrenare_lunga_4.toml --ore 8 --porneste-din 226 --compara-cu 226 --inceput "Once upon a time, there was a fearful little dog named Coco"
#   (oprire: python -m kronos opreste --config config/laptop_antrenare_lunga_4.toml)

[platforma]
nume = "antrenare_lunga_4"
director_lucru = "lucru"
buget_antrenare_secunde = 3600   # o oră de antrenare pe experiment (pregătirea și examenele nu intră)
experimente = 8
prag_zgomot = 0.005

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 85
memorie_gpu_max_mb = 5500      # din 6 GB, lăsăm loc pentru Windows
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_continuu:ModelGPTContinuu"
setari = { n_straturi = 10, n_capete = 8, n_emb = 512, context = 256, lot = 24, rata_invatare = 0.0005, rata_care_scade = true, incalzire_pasi = 100, fractie_rata_finala = 0.1, durata_scaderii_secunde = 28800.0, tokenizer = "bpe", cale_tokenizer = "date/tinystories/bpe_4096.json", cale_stare = "lucru/antrenare_lunga_4/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "profesor"], validare_examene = "date/tinystories_r2/validare.txt" }

[porturi.date]
modul = "module.date_tinystories:DateTinyStories"
setari = { director = "date/tinystories_tot", megaocteti = 2230.0, procent_validare = 0.011, validare_din = "date/tinystories_r2" }   # pregătit deja: TinyStories întreg, fără poveștile cu fapte

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [24] } } }   # nu schimbă nimic: rețeta e fixă

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
