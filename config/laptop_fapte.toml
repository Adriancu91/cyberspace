# Antrenarea pe fapte (7 octombrie 2026, seara): continuare din #239, sfârșitul nopții a patra (martorul):
# val_bpb 0,4389, 51 de fapte din 150, nota profesorului 4,4 ± 0,34 pe 40 de povești. 3 ore.
# Fiecare lot de 24: 10% bucăți din poveștile cu fapte ale profesorului (date/fapte/povesti.txt, 7.520 de povești),
# restul din TinyStories întreg. 24 × 10% = 2,4, deci loturile iau pe rând 2 sau 3 bucăți din hrană (media: exact 10%).
# Rata repornește la 0,0002 (optimizatorul pornește din nou, încălzire în primii 100 de pași) și scade pe cele 3 ore
# până la 0,00002.
# Examen la fiecare 30 de minute (6 experimente): oficial (val_bpb pe validarea R2), apoi faptele și nota profesorului
# pe 40 de povești nevăzute.
# Regula 4 cu criteriul principal fapte_corecte: un experiment e păstrat doar dacă faptele cresc cu peste 10 (din 150)
# față de cel mai bun experiment păstrat și nici val_bpb (pragul 0,005 = prag_zgomot), nici nota (pragul 0,5) nu scad
# peste pragul lor. Primul experiment al liniei e păstrat, ca de obicei.
#   python unelte/antrenare_lunga.py --config config/laptop_fapte.toml --ore 6 --porneste-din 239 --compara-cu 239 --inceput "Once upon a time, there was a fearful little dog named Coco"
#   (oprire: python -m kronos opreste --config config/laptop_fapte.toml)

[platforma]
nume = "fapte_1"
director_lucru = "lucru"
buget_antrenare_secunde = 1800   # 30 de minute de antrenare pe experiment (pregătirea și examenele nu intră)
experimente = 6
prag_zgomot = 0.005

[paznic]
timp_max_secunde = 2700
timp_test_secunde = 600
temperatura_gpu_max = 85
memorie_gpu_max_mb = 5500      # din 6 GB, lăsăm loc pentru Windows
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_continuu:ModelGPTContinuu"
setari = { n_straturi = 10, n_capete = 8, n_emb = 512, context = 256, lot = 24, rata_invatare = 0.0002, rata_care_scade = true, incalzire_pasi = 100, fractie_rata_finala = 0.1, durata_scaderii_secunde = 10800.0, tokenizer = "bpe", cale_tokenizer = "date/tinystories/bpe_4096.json", cale_stare = "lucru/fapte_1/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "profesor"], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "date/fapte/povesti.txt", fractie_hrana = 0.1 }

[porturi.date]
modul = "module.date_tinystories:DateTinyStories"
setari = { director = "date/tinystories_tot", megaocteti = 2230.0, procent_validare = 0.011, validare_din = "date/tinystories_r2" }   # TinyStories întreg; poveștile cu fapte vin prin hrana modelului

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [24] } } }   # nu schimbă nimic: rețeta e fixă

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"

# Regula 4 cu criteriul principal (aprobat de Adrian, 7 octombrie 2026). val_bpb are pragul prag_zgomot (0,005).
[criterii.fapte_corecte]
mai_mare_e_mai_bine = true
prag = 10              # faptele trebuie să crească cu PESTE 10 (din 150)
principal = true

[criterii.nota_profesor]
mai_mare_e_mai_bine = true
prag = 0.5             # nota (pe 40 de povești) nu are voie să scadă cu peste 0,5
