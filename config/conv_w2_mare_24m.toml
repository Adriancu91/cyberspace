# S99 (supraveghetor 10 nov 2026; fereastra Adrian C-97/C-100): Muon din #554, examen de decizie: română, C-88.
# Copie a config/conv_w2_mare_24s.toml (S95) cu DOAR `nume`, `cale_stare`, optimizator "adamw" -> "muon", rata_muon = 0.002
# (= 400 x rata_invatare 5e-6, același raport ca rețeta implicită din model_muon.py: 0,02 / 0,00005), eticheta și acest antet.
# Starea de pornire: lucru/w2_mare_24m/gpt.pt = copia lui #554 (lucru/w2_mare_24s/gpt.pt) cu `minute = 0` și optimizatorul gol.
#   python unelte/antrenare_recalcul.py --config config/conv_w2_mare_24m.toml --ore 5

[platforma]
# Linie nouă; starea de pornire e copia lui #554 cu `minute = 0` și optimizatorul gol în cale_stare (S99).
nume = "w2_mare_24m"
director_lucru = "lucru"
buget_antrenare_secunde = 3600
experimente = 3
prag_zgomot = -1.0

[criterii]

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 83
memorie_gpu_max_mb = 7000
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_muon:ModelGPTConversatieMuon"
setari = { n_straturi = 24, n_capete = 12, n_emb = 768, context = 512, lot = 4, rata_invatare = 0.000005, rata_care_scade = true, incalzire_pasi = 1000, fractie_rata_finala = 1.0, tokenizer = "bpe", cale_tokenizer = "date/ws/bpe_16384.json", cale_stare = "lucru/w2_mare_24m/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "fapte_noi", "profesor"], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "date/fapte/povesti.txt", fractie_hrana = 0.05, conversatie = "lucru/romana_raspunsuri/antrenare.jsonl", fractie_conversatie = 0.45, durata_scaderii_secunde = 18000, adunare_loturi = 24, racire_finala = 0.25, optimizator = "muon", rata_muon = 0.002 }

[antrenare_lunga]
eticheta = "S99: Muon din #554, examen de decizie: română, C-88"

[porturi.date]
modul = "module.date_amestec:DateAmestec"
setari = { cale_antrenare = "date/ws/amestec/antrenare.txt", cale_validare = "date/tinystories_r2/validare.txt" }

[porturi.examen]
modul = "module.examen_romana:ExamenRomana"
setari = { caractere = 100000, cu_r1 = false }

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [4] } } }

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
