# CONTINUUM v2 pe workstation (12 octombrie 2026; docs/CONTINUUM_plan.md, secțiunea 14; docs/MUTARE_workstation.md,
# secțiunea 8). Workstation-ul e doar al lui Kronos: poate învăța la orice oră. La fiecare alegere are cel puțin două
# variante adevărate: continuă linia care încă învață (o prelungește, dacă și-a făcut orele), remăsoară, sau pornește
# o linie nouă dintr-o configurare ws_* neîncepută. Care se alege o spune „ordinea_nevoilor”; jurnalul ciclului notează
# și variantele nealese („alternative”). Nu antrenează și nu dă examene singur: pornește uneltele lui Kronos.
# PE BUNE din 13 octombrie 2026 (hotărât de Adrian), cu jurnalul în lucru/continuum_ws/. Tot atunci (v3):
# - româna și codul sunt capacități, măsurate cu unelte/examen_validari_ws.py; nevoia „deprinde” cere linia care le
#   învață (W2) și stă înaintea lui „continua”. Din 14 octombrie (Adrian): cât timp ultima noapte le-a scăzut cu cel
#   puțin 0,05 pe copiile răcite (nu după pragul fix de 3,0);
# - ziua (07:45–18:40) se pot da examene și se poate continua o linie veche, cel mult până la 18:20; o antrenare
#   de noapte (linie nouă, deprindere) pornește doar între 19:00 și 21:00. În rest, doar observă.
# - hrana nouă de la profesor nu se mai cere singură (vezi [hrana.fapte]).
# Pornirea fără fereastră: unelte/continuum_ws.ps1 (o pornește Task Scheduler: unelte/programeaza_continuum_ws.ps1).
#
#   python -m module.continuum.bucla --config config/continuum_ws.toml --simuleaza --stare lucru/continuum_ws   # doar spune ce ar alege
#   python -m module.continuum.bucla --config config/continuum_ws.toml --stare lucru/continuum_ws               # pornește și experimentele
#   python -m module.continuum.bucla --config config/continuum_ws.toml --stare lucru/continuum_ws --jurnal      # ultimele cicluri
# Starea și jurnalul lui stau în lucru/continuum_ws/ (cele de pe laptop, din lucru/continuum*/, rămân neatinse).
# Oprire: același buton ca Kronos (lucru/STOP): python -m kronos opreste --config config/proba.toml
# Pornire din nou: python -m kronos porneste --config config/proba.toml

[continuum]
director_lucru = "lucru"               # ca la Kronos: același STOP (lucru/STOP), același jurnal (doar citit)
redescopera_la_cicluri = 6             # la câte cicluri recitește acest fișier și reverifică modulele
jurnal_max_mb = 20                     # peste atât, cicluri.jsonl se mută deoparte și se începe altul
# Urgența: măsurarea întâi (și remăsurarea, pusă singură după ea); apoi deprinderea (româna și codul, cât sunt peste
# pragul lor: greutate mare, hotărâtă de Adrian pe 13 octombrie); apoi continuarea liniei care încă învață; apoi o
# linie nouă; la urmă hrana. „repara” (zona roșie) e mereu prima. Ordinea folosită:
# repara, masoara, remasoara, deprinde, continua, linie_noua, dezvolta.
# REGULA DE ALEGERE E ACEASTĂ ORDINE: dintre nevoile care se pot face acum, se alege prima de aici.
ordinea_nevoilor = ["masoara", "deprinde", "continua", "linie_noua", "dezvolta"]

[guvernator]
# O singură sarcină grea pe placă odată rămâne regula: cât rulează o antrenare, CONTINUUM stă în REPAUS.
# Din 13 octombrie 2026: noaptea e a liniei principale, care pornește la 19:00. O antrenare de noapte se poate porni
# doar între 19:00 și 21:00 (mai târziu n-ar mai încăpea până dimineață); după ce se termină, CONTINUUM nu mai
# pornește alta până seara următoare. Ziua, între 07:45 și 18:40: examene și, dacă e cazul, continuarea unei linii.
fereastra_invatare = "19:00-21:00"     # când se poate PORNI o antrenare de noapte (ÎNVĂȚARE)
fereastra_intretinere = "07:45-18:15"  # ziua (ÎNTREȚINERE): examene; din 14 oct până la 18:15, ca un examen
                                       # pornit seara să nu țină placa la 19:00
minute_fara_om = 10                    # dacă cineva lucrează la workstation (tastatură sau mouse), CONTINUUM așteaptă
temperatura_max = 83                   # peste: coboară un nivel (aceeași limită ca paznicul de pe workstation)
memorie_video_libera_min_mb = 4500     # sub atât, placa e ocupată de altceva (profesorul cere ~4.500 MB)
procese_grele = ["python"]             # dacă un astfel de program folosește placa (Kronos, profesorul), e ocupată
# v1, anti-buclă: câte ore pe placă pe zi, cu tot ce pornește oricine (orele din jurnalul Kronos începute azi). Peste
# buget: REPAUS până mâine. 20 lasă plăcii ~4 ore de odihnă pe zi.
buget_ore_placa_pe_zi = 20
# 15–17 octombrie 2026: alegerea e a lui Adrian (conversația, W2-conv, școala de cod, rata lui W2), nu a lui
# CONTINUUM. Până atunci doar observă, iar fiecare ciclu din jurnal spune de ce.
om_decide_pana_la = "2026-10-18T07:45"
om_decide_motiv = "17 octombrie: după noaptea 7 (rata 0,00025, confirmat), Adrian alege rata lui W2 sau un martor; nimic pe placă fără el"
# 17 octombrie, seara (Adrian): rata lui W2 e de acum 0,00025, ca rețetă (config/ws_w2.toml, din care CONTINUUM
# pornește linia W2), fără martor. Perioada de mai sus rămâne neschimbată.

[guvernator.pauza_minute]              # cât așteaptă între două cicluri, pe nivel (secțiunea 3)
REPAUS = 5
"ÎNTREȚINERE" = 3
"ÎNVĂȚARE" = 1

[invatare]
incredere_initiala = 0.5               # cu cât pornește o strategie nouă (0–1)
pas_incredere = 0.1                    # cât urcă la SUCCES și cât coboară la EȘEC

# --- Modulele urmărite (ca în configurările Kronos). Descoperite la pornire și la fiecare „redescopera_la_cicluri”
# cicluri. Dacă unul lipsește, nu se încarcă sau spune că a căzut (sanatate(), opțional), capacitățile care depind
# de el devin indisponibile; restul merge mai departe.
[module]
model = "module.model_continuu:ModelGPTContinuu"
examen = "module.examen_bpb:ExamenBpb"
examene_elev = "module.examene_elev"
profesor = "module.profesor_qwen:ProfesorQwen"

# --- Antrenările care contează (liniile URMĂRITE: de aici vin tendința, linia de bază și ultimul model păstrat).
# Pe workstation: doar liniile noi (config/ws_w*.toml). Liniile de pe laptop nu sunt urmărite: #295 (0,4249, după zeci
# de ore) ar fi linia de bază, iar o linie nouă, de la zero, ar sta nopți întregi în „zona roșie” față de el.
# Comparația cu laptopul se face de om, în pre-înregistrări.
[linii]
configurari = ["config/ws_w*.toml"]

# --- Capacitățile și examenele lor (secțiunea 5). Linia de bază = cel mai bun experiment PĂSTRAT de Kronos.
# Pragurile de zgomot, alese de Adrian pe 7 octombrie 2026, după noaptea a patra (faptele sar cu până la ±13 de la o
# oră la alta; o notă pe 20 de povești are eroarea ±0,3–0,5): 0,005 la val_bpb (ca prag_zgomot), 10 fapte, 0,5 la notă.
# Din 8 octombrie 2026, nota are pragul 1,0, ca în Kronos: eroarea ei e ±0,35, cu valori extreme (0,5 a respins #261 din
# zgomot).
[capacitati.povesti]
metrica = "val_bpb"                    # examenul oficial, din fișa experimentului
mai_mare_e_mai_bine = false
prag_zgomot = 0.005                    # ca prag_zgomot din configurările Kronos
module = ["model", "examen"]

[capacitati.fapte]
metrica = "fapte_noi"                  # din 150: examenul de fapte nou, reformulat (din 7 octombrie 2026)
mai_mare_e_mai_bine = true
prag_zgomot = 10
maxim = 150                            # „cea mai slabă capacitate” = cel mai mic procent din maxim
module = ["examene_elev"]
unealta = { linie = "examen_fapte_nou", scor = "fapte_noi" }
masurare = ["{python}", "unelte/examen_fapte_nou.py", "--experiment", "{experiment}"]

[capacitati.sens]
metrica = "nota_profesor"              # media notelor profesorului pe aceleași 40 de povești nevăzute
mai_mare_e_mai_bine = true
prag_zgomot = 1.0                      # din 8 octombrie (înainte 0,5): ca criteriul notei din Kronos
maxim = 10
povesti = 40                           # nota se compară doar între măsurători pe 40 de povești: cele pe 20 (până pe
                                       # 7 octombrie, ex. 4,7 la #226) nu intră în linia de bază (8 octombrie 2026)
module = ["profesor"]
unealta = { linie = "examen_profesor", scor = "nota_medie" }
masurare = ["{python}", "unelte/examen_profesor.py", "--experiment", "{experiment}", "--povesti", "40", "--doar-local"]

# Româna și codul (13 octombrie 2026): biți pe octet pe validările puse deoparte (media pe Wikipedia, web și cărți,
# respectiv pe cod și sarcini de cod). Linia veche (W1) nu le știe deloc: 6,42 și 4,77 la #312. „prag_deprins”
# (pragul fix 3,0) a fost regula din 13 octombrie; din 14 octombrie nevoia „deprinde” folosește „scadere_minima” și
# pragul nu mai e citit.
[capacitati.romana]
metrica = "bpb_romana"
mai_mare_e_mai_bine = false
prag_zgomot = 0.05                     # estimare de pornire: nu avem încă două măsurători pe același fel de model
prag_deprins = 3.0
module = ["model"]
unealta = { linie = "examen_validari_ws", scor = "bpb_romana" }
masurare = ["{python}", "unelte/examen_validari_ws.py", "--experiment", "{experiment}"]

[capacitati.cod]
metrica = "bpb_cod"
mai_mare_e_mai_bine = false
prag_zgomot = 0.05
prag_deprins = 3.0
module = ["model"]
unealta = { linie = "examen_validari_ws", scor = "bpb_cod" }
masurare = ["{python}", "unelte/examen_validari_ws.py", "--experiment", "{experiment}"]

# --- Hrana: textele noi pe care învață o capacitate (le scrie profesorul).
[hrana.fapte]
dosar = "date/fapte"                   # info.json spune câte povești au rămas
minima_povesti = 5000                  # sub atât, prea puțină pentru o noapte (prima hrană: 7.520 de povești)
# Fără „comanda” din 13 octombrie 2026 (pornirea pe bune): hrana nouă ar ține placa o oră cu profesorul și ar
# schimba date/fapte, din care învață liniile. O pornește doar Adrian. Cu ea, „dezvolta” devine din nou posibilă ziua:
# comanda = ["{python}", "unelte/genereaza_fapte.py", "--povesti", "{tinta_povesti}", "--ore", "1", "--doar-local"]
# adaos_povesti = 2000                 # câte povești în plus cere ziua, când hrana s-a terminat
# timeout_ore = 1.5

# --- Nevoile. v0: masoara, continua, dezvolta. v1 adaugă două, fără secțiunea lor aici (planul, secțiunea 13):
# „repara” (zona roșie: un raport către om, oricând, chiar și în REPAUS) și „remasoara” (zona galbenă sau un candidat
# de confirmat: setările lui „masoara”).
[nevoi.masoara]
# Examenele care lipsesc pe ultimul model păstrat (comanda fiecăruia e la capacitatea lui, „masurare”).
nivel = "ÎNTREȚINERE"                  # ziua sau noaptea, cu placa liberă
timeout_minute = 30                    # pentru fiecare examen

[nevoi.continua]
# Povestirile încă învață: încă o antrenare lungă, cu o configurare existentă și neterminată.
nivel = "ÎNVĂȚARE"                     # din 14 octombrie: doar noaptea (W1 nu mai primește ore; W2 doar noaptea)
capacitate = "povesti"
castig_minim = 0.005                   # v1: ultima oră trebuie să coboare val_bpb cu PESTE atât (pragul regulii)
ore_tendinta = 3                       # v1: ȘI tendința pe ultimele atâtea ore trebuie să fie bună (val_bpb scade);
                                       # două ore la rând cu câștig sub prag = „saturat”: „dezvolta” trece în față
# LISTA ALBĂ: liniile pe care le poate continua. Cu [nevoi.linie_noua] mai jos, „continua” ia doar liniile începute.
# Din 14 octombrie (Adrian): W1 rămâne reper și nu mai primește ore de placă; doar linia principală W2.
configurari = ["config/ws_w2.toml"]
# v2: dacă linia și-a făcut toate orele plănuite și încă învață, o prelungește cu atâtea ore (rata rămâne la capătul
# scăderii: pași mici, ca antrenarea 8 de pe laptop). 0 = nu prelungește.
prelungire_ore = 10
timeout_ore = 13                       # 10 ore cu examenele lor (~10,7 ore), copia răcită și examenele ei (~0,7 ore)

# v3: româna și codul. Din 14 octombrie 2026 (Adrian): nevoia rămâne activă cât timp ultima noapte a scăzut nota cu
# cel puțin 0,05 față de cea dinainte, pe copiile răcite (liniile de jurnal ws_w2_racit_*); înaintea primei nopți se
# socotește măsurătoarea modelului #312 (W1: 6,42 și 4,77). Se învață doar pe liniile din lista albă: W2 (neîncepută:
# de la zero; începută: reluată sau prelungită cu prelungire_ore, din starea nerăcită).
[nevoi.deprinde]
nivel = "ÎNVĂȚARE"                     # doar ca antrenare de noapte (pornită între 19:00 și 21:00)
# Scrisă în motivul nevoii, la fiecare ciclu din jurnal (cerut de Adrian pe 13 octombrie):
nota = "locul acestei nevoi înaintea lui „continua” și regula ei (cel puțin 0,05 scădere pe noapte) vin din greutățile date de Adrian pentru română și cod (13 și 14 octombrie 2026), nu dintr-o reglare a lui CONTINUUM"
capacitati = ["romana", "cod"]
scadere_minima = 0.05
copii = "ws_w2_racit_*"                # liniile de jurnal ale copiilor răcite (modelele zilei)
pornire = 312                          # măsurătoarea dinaintea primei nopți (W1, ora 10)
configurari = ["config/ws_w2.toml"]
prelungire_ore = 10                    # nopțile următoare: încă 10 ore, din starea nerăcită
timeout_ore = 13                       # 10 ore cu examenele lor (~10,7 ore), copia răcită și examenele ei (~0,7 ore)

# v2: o linie nouă, DE LA ZERO, dintr-o configurare care n-a pornit niciodată. Lista albă e mai jos; fără nimic
# neînceput în ea, nevoia nu apare.
[nevoi.linie_noua]
nivel = "ÎNVĂȚARE"
capacitate = "povesti"                 # pe ce se judecă rezultatul (val_bpb, comparabil între linii)
configurari = ["config/ws_w2.toml"]    # LISTA ALBĂ a liniilor noi
timeout_ore = 13

[nevoi.dezvolta]
# Cea mai slabă capacitate. Noaptea: antrenare pe hrana ei (o configurare existentă, neterminată, care pomenește
# dosarul hranei). Ziua: hrană nouă de la profesor, doar dacă nu e deja destulă hrană nefolosită.
nivel = "ÎNTREȚINERE"
configurari = []                       # nicio antrenare doar pe hrană: liniile ws_* au deja 5% fapte în fiecare lot
timeout_ore = 10

# --- CONTINUUM v1 (docs/CONTINUUM_plan.md, secțiunea 13). Toate au valori implicite: fără ele, merge la fel.
[zgomot]
# Zgomotul învățat al fiecărei capacități, din jurnal: același model examinat de două ori, sau două semințe ale
# aceleiași configurări. Pragul folosit = max(prag_zgomot de la capacitate, care rămâne podea; zgomotul învățat).
perechi_minime = 3                     # sub atâtea perechi rămâne podeaua, iar jurnalul spune „neînvățat încă”
factor = 1.0                           # zgomotul = factor × cât diferă de obicei două măsurători (rădăcina mediei pătratelor)
minute_minime = 60                     # doar din experimente de cel puțin atâtea minute: cele scurte de căutare diferă
                                       # mult mai mult între semințe și umflau pragul (8 octombrie 2026)

[zone]
# Față de linia de bază, în praguri (pragul folosit al capacității). Deasupra lui „galben”: zona verde.
galben = 1.0                           # între 1 și 2 praguri sub: zona galbenă, cere remăsurare, nu acțiune
rosu = 2.0                             # peste 2 praguri sub: zona roșie, nevoia „repara” (în v1: raport către om)

[stabilitate]
# Un scor mai bun e întâi „candidat”; linia de bază și încrederea strategiei se mută doar după confirmare.
confirmari = 1                         # câte măsurători independente (a doua examinare, o oră păstrată mai nouă)

[eficienta]
# SUCCES cu câștigul pe oră de placă sub atât din media strategiei = „SUCCES SCUMP”: încrederea nu urcă.
fractie_scump = 0.5

[anti_bucla]
racire_cicluri = 20                    # o nevoie tratată pe bune nu se reia atâtea cicluri („repara” n-are răcire);
                                       # ziua, 20 de cicluri la 3 minute = o oră
max_esecuri = 5                        # după atâtea eșecuri la rând: strategia „blocată”, raport către om

[comenzi]
# Cum pornește o antrenare lungă (o oră = un experiment Kronos). {config}, {ore} și {ultimul_model} se completează
# singure. Fără un model păstrat cu aceeași arhitectură, „--porneste-din” dispare și linia pornește de la zero.
antrenare = ["{python}", "unelte/antrenare_lunga.py", "--config", "{config}", "--ore", "{ore}", "--porneste-din", "{ultimul_model}", "--inceput", "Once upon a time, there was a fearful little dog named Coco"]
