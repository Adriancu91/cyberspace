# S34 (proba de control, aprobat de supraveghetor 27 oct 2026, granițele 1 și 2): linia „w2_reteta_C”, din #415, cu rețeta
# veche. Copie EXACTĂ a config/conv_w2_text_v3.toml (rețeta lui #415: module.model_conversatie, aceleași date, aceeași
# sămânță, 45/5/50, rata 0,00005 constantă, lot 12, context 512, fără adunare pe loturi, fără răcire). Față de ea, doar
# `nume`, `cale_stare`, eticheta și acest antet. Întrebarea: câștigul lui #441 (S31 A) vine din rețetă sau din cele 2 ore?
# Pre-înregistrarea: docs/preinregistrari/2026-10-27_reteta_control.md.
#   python unelte/antrenare_lunga.py --config config/conv_w2_reteta_C.toml --ore 2 --porneste-din 415

[platforma]
# Linie nouă, ca `--porneste-din 415` să se aplice (lucru/w2_reteta_C/ nu există la 27 oct, verificat în S34).
nume = "w2_reteta_C"
director_lucru = "lucru"
buget_antrenare_secunde = 3600
experimente = 3
prag_zgomot = -1.0

[criterii]

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 83
memorie_gpu_max_mb = 7000
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_conversatie:ModelGPTConversatie"
setari = { n_straturi = 12, n_capete = 12, n_emb = 768, context = 512, lot = 12, rata_invatare = 0.00005, rata_care_scade = true, incalzire_pasi = 100, fractie_rata_finala = 1.0, tokenizer = "bpe", cale_tokenizer = "date/ws/bpe_16384.json", cale_stare = "lucru/w2_reteta_C/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "fapte_noi", "profesor"], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "date/fapte/povesti.txt", fractie_hrana = 0.05, conversatie = "date/conversatie/text_v3/antrenare.jsonl", fractie_conversatie = 0.45 }

[antrenare_lunga]
eticheta = "S34 C: rețeta veche"

[porturi.date]
modul = "module.date_amestec:DateAmestec"
setari = { cale_antrenare = "date/ws/amestec/antrenare.txt", cale_validare = "date/tinystories_r2/validare.txt" }

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [12] } } }

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
