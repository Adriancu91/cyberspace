# S76b (aprobat de supraveghetor, 4 nov 2026 23:20, granița 1; partea R1 din COMENZI.md C-64, aprobată de Adrian 4 nov 11:30):
# o noapte din #477 pe o copie, pe perechile S76a (răspunsuri în română, 50 % instrucțiuni). Copie exactă a
# config/conv_w2_reteta_A_cont3.toml (S51, cea care a dat #477), cu DOAR: `nume`, `cale_stare`, `conversatie`,
# `durata_scaderii_secunde` (5 ore = 18000), eticheta și acest antet schimbate.
#   python unelte/antrenare_lunga.py --config config/conv_w2_romana_r1.toml --ore 5 --porneste-din 477

[platforma]
# Linie nouă, ca `--porneste-din 477` să se aplice (lucru/w2_romana_r1/ nu există la 4 nov 23:30).
nume = "w2_romana_r1"
director_lucru = "lucru"
buget_antrenare_secunde = 3600
experimente = 3
prag_zgomot = -1.0

[criterii]

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 83
memorie_gpu_max_mb = 7000
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_muon:ModelGPTConversatieMuon"
setari = { n_straturi = 12, n_capete = 12, n_emb = 768, context = 512, lot = 12, rata_invatare = 0.00005, rata_care_scade = true, incalzire_pasi = 100, fractie_rata_finala = 1.0, tokenizer = "bpe", cale_tokenizer = "date/ws/bpe_16384.json", cale_stare = "lucru/w2_romana_r1/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "fapte_noi", "profesor"], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "date/fapte/povesti.txt", fractie_hrana = 0.05, conversatie = "lucru/romana_raspunsuri/antrenare.jsonl", fractie_conversatie = 0.45, durata_scaderii_secunde = 18000, adunare_loturi = 8, racire_finala = 0.25, optimizator = "adamw" }

[antrenare_lunga]
eticheta = "S76b: o noapte (5 ore) din #477 pe răspunsurile în română (S76a)"

[porturi.date]
modul = "module.date_amestec:DateAmestec"
setari = { cale_antrenare = "date/ws/amestec/antrenare.txt", cale_validare = "date/tinystories_r2/validare.txt" }

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [12] } } }

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
