# 17 OCTOMBRIE 2026 (hotărât de Adrian): rata constantă e de acum 0,00025 (înainte 0,0005), ca în noaptea 7
# (config/ws_w2_r025.toml; confirmat: româna 1,3488 → 1,3102), fără o noapte de comparație la 0,0005. Partea din
# câștig care vine din rată e nesigură (docs/preinregistrari/2026-10-16_noaptea7_w2_rata.md, „Decizia lui Adrian”).
# Răcirea de la sfârșitul nopții merge deci liniar 0,00025 → 0,00005.
#
# Workstation, W2 „principal” (docs/MUTARE_workstation.md, secțiunea 4): linia nouă, DE LA ZERO, cu tokenizer-ul nou.
# 12 straturi × 768 (12 capete), context 512, lot 12, vocabular 16.384 (date/ws/bpe_16384.json, regulile „ws”:
# numerele 0–999 simboluri întregi). 98,0 milioane de parametri.
# REȚETA (hotărâtă de Adrian pe 13 octombrie 2026; linia principală, care nu se mai repornește niciodată; rata schimbată pe 17 octombrie, vezi mai jos):
# - încălzire ~5 minute (1.730 de pași la ~5,8 pași pe secundă, măsurat la proba din 13 octombrie), apoi rata de învățare CONSTANTĂ, fără
#   scădere, oricâte nopți (rata_care_scade = true cu fractie_rata_finala = 1.0 înseamnă: doar încălzirea);
# - la sfârșitul fiecărei nopți, o COPIE răcită 30 de minute (rata scade liniar la 0,00005) dă toate examenele
#   (val_bpb, fapte, fapte noi, sacru, nota, română, cod) și e „modelul zilei”, salvat separat de Kronos pe linia
#   de jurnal ws_w2_racit_<ore>; linia continuă noaptea următoare din starea de DINAINTE de răcire
#   (unelte/copie_racita.py, module/model_racit.py; secțiunea [antrenare_lunga] de mai jos);
# - examenele de la fiecare oră rămân, pe modelul nerăcit, doar pentru tendință (în jurnal: „nerăcit”). Cu rata
#   constantă, cifrele lor sunt mai mari decât ale unei linii cu rata care scade și unele ore pot fi „respinse”
#   de Kronos; starea liniei merge oricum mai departe;
# - antrenarea propriu-zisă se oprește la ora 10 sau la 06:45, ce vine întâi, ca răcirea și examenele să încapă
#   până la oprirea de siguranță de la 07:30.
# Datele: amestecul din date/ws/amestec/antrenare.txt, făcut de unelte/pregateste_amestec_ws.py, care împarte și
# simbolurile. Din 12 octombrie, seara (cu codul din The Stack): 4,89 GB = 45,9% engleză simplă, 33,9% română,
# 15,1% cod Python cu licențe permisive, 5,1% numere și calcule (părțile reale: date/ws/amestec/info.json).
# Hrana: 6% din fiecare lot vine din date/ws/hrana_fapte_abecedar.txt = 5% povești cu fapte + 1% abecedarul școlii
# de cod (abecedarul e repetat în fișier cât să fie 1 parte la 5 părți de fapte).
# Examenul oficial rămâne val_bpb pe validarea TinyStories R2 (biți pe octet, deci comparabil cu liniile vechi, deși
# tokenizer-ul e altul). Examenele de la oră: fapte, fapte_noi, nota profesorului pe 40 de povești.
# Paznicul are limitele workstation-ului (aprobate de Adrian, 12 octombrie 2026): 7.000 MB și 83 °C.
# Lotul rămâne 12 (hotărât de Adrian); noaptea placa nu e folosită pentru altceva.
# Proba de 5 minute cu tokenizer-ul și amestecul de acum: 13 octombrie dimineața (linia „ws_w2_proba3”; cifrele în
# docs/preinregistrari/2026-10-13_noaptea4_w2.md).
#   python unelte/pregateste_amestec_ws.py --config config/ws_w2.toml        # o singură dată, pe procesor
#   python unelte/antrenare_lunga.py --config config/ws_w2.toml --ore 10 --inceput "Once upon a time, there was a fearful little dog named Coco"
#   (oprire: python -m kronos opreste --config config/ws_w2.toml)

[platforma]
nume = "ws_w2"
director_lucru = "lucru"
buget_antrenare_secunde = 3600   # o oră de antrenare pe experiment (pregătirea și examenele nu intră)
experimente = 10
prag_zgomot = 0.005

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 83       # RTX 3070 Ti își reduce singură viteza pe la 83 °C
memorie_gpu_max_mb = 7000      # din 8 GB, lăsăm ~1 GB pentru Windows
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_continuu:ModelGPTContinuu"
setari = { n_straturi = 12, n_capete = 12, n_emb = 768, context = 512, lot = 12, rata_invatare = 0.00025, rata_care_scade = true, incalzire_pasi = 1730, fractie_rata_finala = 1.0, tokenizer = "bpe", cale_tokenizer = "date/ws/bpe_16384.json", cale_stare = "lucru/ws_w2/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "fapte_noi", "profesor"], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "date/ws/hrana_fapte_abecedar.txt", fractie_hrana = 0.06 }

# Citită de unelte/antrenare_lunga.py (Kronos nu o citește).
[antrenare_lunga]
pana_la = "06:45"            # antrenarea propriu-zisă nu trece de ora asta; ultima oră se scurtează
copie_racita = true           # la sfârșitul rulării: modelul zilei, dintr-o copie; linia rămâne nerăcită
minute_racire = 30
rata_finala_racire = 0.00005
eticheta = "nerăcit"          # scrisă în descrierea fiecărei ore din jurnal

[porturi.date]
modul = "module.date_amestec:DateAmestec"
setari = { cale_antrenare = "date/ws/amestec/antrenare.txt", cale_validare = "date/tinystories_r2/validare.txt" }

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [12] } } }   # nu schimbă nimic: rețeta e fixă

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
