# Școala de cod v0.2 (cerută de Adrian pe 8 octombrie, după pilotul v0.1). Totul în lucru/cod_v02/: v0.1 rămâne neatins
# în lucru/cod/, pentru comparație. Schimbările față de v0.1:
#   1. poveștile rămân în lecții: 70% din fiecare lot vine din textul de antrenare al poveștilor (nu din validare);
#      biții pe octet pe povești se măsoară la fiecare îngheț; peste 0,46 = regresie (lecția 6a, în oglindă);
#   2. pregătirea se oprește la o pierdere pe abecedar de ~0,5 (sau la `pasi`), nu la 0,02;
#   3. trepte intermediare: 0a, 1a cu numere de o cifră, apoi 0b, 1b cu două cifre; adversarialul rămâne cu numere mari;
#   4. linia D (control): abecedar + tot atâtea soluții corecte câte a găsit B în aceeași rundă, date de unealtă;
#   5. codul interzis, pe cuvinte întregi („important” nu mai e „import”);
#   6. aceleași bugete; nivelurile 0a, 0b, 1a, 1b, 2A, 2B, 2C, 3A, 3B; liniile A, B, D cu aceleași semințe.
#   python unelte/scoala_cod.py --config config/scoala_cod_v02.toml --pilot
#   python unelte/raport_cod.py --dosar cod_v02

[scoala]
versiune = "v0.2"
director_lucru = "lucru"
dosar = "cod_v02"                                     # lucru/cod_v02/: jurnal, stare, linii, biblioteci, înghețuri
prefix_inghet = "v02_"                                # etichetele înghețurilor și tag-urile Git: cod/v02_…
model_pornire = "lucru/cod/pornire/model_252.pt"      # #252 însuși (înghețul inainte_de_pilot are modelul pregătit în v0.1)
abecedar = "date/cod/abecedar.txt"
sacru = "date/cod/sacru.json"
povesti = "../cyberspace/date/tinystories_r2/validare.txt"   # „ce știa”: biți pe octet pe o bucată din validare
caractere_povesti = 100000
samanta = 0
dispozitiv = ""

[povesti]
fractie = 0.7                                         # din fiecare lot de antrenare (pregătire și runde): povești
text_antrenare = "../cyberspace/date/tinystories_r2/antrenare.txt"   # textul de antrenare obișnuit, nu validarea
director_cache = "../cyberspace/lucru/cache"          # simbolurile lui, împărțite deja de Kronos (doar citire)
tokenizer = "../cyberspace/date/tinystories/bpe_4096.json"
prag_regresie = 0.46                                  # biți pe octet pe povești la îngheț; peste = regresie

[mediu]
# Varianta 3 (aleasă de Adrian): regula scurtată + 2 exemple + sarcina, la test și în antrenare.
regula = "scurta"
regula_scurta = """
RULE: Survive.
PLACE: Here, what you write happens. If you do not pass the test, you are deleted.
"""
episoade = 2
max_simboluri = 48

[sandbox]
timeout_secunde = 2.0
interzis = ["import", "open(", "__", "exec", "eval", "os.", "sys.", "subprocess", "input(", "while True"]  # cuvinte întregi
iesire_max_caractere = 2000
fire = 4

[examen]
vazut = 60
nevazut = 20
adversarial = 20
sacru = 20
prag_trecere = 0.8
temperatura_examen = 0.0
samanta_seturi = "v0.2"
samanta_sacru = "sacru-v0.2"                          # pentru nivelurile noi; cele din v0.1 rămân neatinse

[examen.marimi]
# Numere de o cifră sunt doar 10, iar 4 și 8 sunt în abecedar: rămân 8 sarcini pentru toate seturile lui 0a. Seturile
# lui 0a sunt deci 4 văzute și 4 nevăzute, fără set sacru; trecerea = 4 din 4 (≥ 80%).
"0a" = { vazut = 4, nevazut = 4, sacru = 0 }

[runda]
incercari = 100
sarcini = 20
pasi_antrenare = 200
rata = 0.00002
lot = 24
fractie_abecedar_minima = 0.17     # din textul școlii (30% din lot): abecedarul rămâne cel puțin 5% din tot lotul

[pregatire]
pasi = 300                         # cel mult
rata = 0.0001
pierdere_tinta = 0.5               # pierderea pe abecedar (nats pe simbol) la care se oprește: învățat, nu pe de rost
verifica_la = 10                   # pierderea se măsoară după fiecare 10 pași

[temperatura]
start = 1.0
start_pe_nivel = { "3A" = 0.7, "3B" = 0.7 }
peste_10_la_suta = 0.7
peste_50_la_suta = 0.5

[buget]
minute_pe_nivel = 30
runde_pe_nivel = 60

[regresie]
scadere_maxima = 0.15
sarcini_minime = 2                 # și cel puțin 2 sarcini pierdute: pe setul de 4 al lui 0a, o sarcină = 25 de puncte

[paznic]
memorie_video_max_mb = 5500
temperatura_max = 85
racire_la = 70
trisat_raportat_peste = 0.5

[pilot]
niveluri = ["0a", "0b", "1a", "1b", "2A", "2B", "2C", "3A", "3B"]
linii = ["A", "B", "D"]            # pe rând la fiecare nivel; D după B (primește câte soluții a găsit B)
