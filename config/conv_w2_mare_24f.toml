# S85 (aprobat de supraveghetor, 6 nov 2026 23:15, granițele 1 și 2): prima noapte de 5 ore a lui Kronos de 24 de straturi pe rețeta e1.
# Copie a config/conv_w2_mare_24e1.toml (S77e varianta 1, ȚINE), cu DOAR `nume`, `cale_stare`, eticheta și acest antet schimbate.
# (Rețeta e1: rata 1e-5, încălzire 1000 de pași, lot 4 × 24, durata_scaderii_secunde 18000, racire_finala 0.25, adamw.)
#   python unelte/antrenare_recalcul.py --config config/conv_w2_mare_24f.toml --ore 5

[platforma]
# Linie nouă; starea de pornire e copia lui lucru/w2_mare/gpt_24.pt în cale_stare (lucru/w2_mare_24f/ nu există înainte).
nume = "w2_mare_24f"
director_lucru = "lucru"
buget_antrenare_secunde = 3600
experimente = 3
prag_zgomot = -1.0

[criterii]

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 83
memorie_gpu_max_mb = 7000
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_muon:ModelGPTConversatieMuon"
setari = { n_straturi = 24, n_capete = 12, n_emb = 768, context = 512, lot = 4, rata_invatare = 0.00001, rata_care_scade = true, incalzire_pasi = 1000, fractie_rata_finala = 1.0, tokenizer = "bpe", cale_tokenizer = "date/ws/bpe_16384.json", cale_stare = "lucru/w2_mare_24f/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "fapte_noi", "profesor"], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "date/fapte/povesti.txt", fractie_hrana = 0.05, conversatie = "lucru/romana_raspunsuri/antrenare.jsonl", fractie_conversatie = 0.45, durata_scaderii_secunde = 18000, adunare_loturi = 24, racire_finala = 0.25, optimizator = "adamw" }

[antrenare_lunga]
eticheta = "S85: prima noapte de 5 ore a lui Kronos de 24 de straturi pe rețeta e1 (rata 1e-5, încălzire 1000, lot 4 × 24)"

[porturi.date]
modul = "module.date_amestec:DateAmestec"
setari = { cale_antrenare = "date/ws/amestec/antrenare.txt", cale_validare = "date/tinystories_r2/validare.txt" }

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [4] } } }

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
