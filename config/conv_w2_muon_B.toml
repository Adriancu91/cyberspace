# S30/S31 (C-21.2, aprobat de Adrian 26 oct 2026): linia B, Muon pe matricile din straturi (lr 0,01, ales la S30 după probă), AdamW ca acum pe rest. Copie a config/conv_w2_text_v3.toml (rețeta lui #415: aceleași
# date, aceeași sămânță, 45/5/50, rata 0,00005, lot 12, context 512). Față de ea: modulul module.model_muon (aceeași
# rețea și aceleași loturi; fără opțiunile noi face exact pașii lui ModelGPTConversatie), `nume`, `cale_stare`, plus,
# la A și la B la fel: gradient adunat pe 8 loturi (adunare_loturi = 8), răcire liniară până la 0 în ultimele 25% din
# cele 2 ore (racire_finala = 0.25, durata_scaderii_secunde = 7200). A și B diferă doar prin optimizator.
#   python unelte/antrenare_lunga.py --config config/conv_w2_muon_B.toml --ore 2 --porneste-din 415

[platforma]
# Linie nouă, ca `--porneste-din 415` să se aplice (lucru/w2_muon_B/ nu există la 27 oct).
nume = "w2_muon_B"
director_lucru = "lucru"
buget_antrenare_secunde = 3600
experimente = 3
prag_zgomot = -1.0

[criterii]

[paznic]
timp_max_secunde = 4500
timp_test_secunde = 600
temperatura_gpu_max = 83
memorie_gpu_max_mb = 7000
pauza_racire_secunde = 120
porturi_modificabile = ["model"]

[porturi.model]
modul = "module.model_muon:ModelGPTConversatieMuon"
setari = { n_straturi = 12, n_capete = 12, n_emb = 768, context = 512, lot = 12, rata_invatare = 0.00005, rata_care_scade = true, incalzire_pasi = 100, fractie_rata_finala = 1.0, tokenizer = "bpe", cale_tokenizer = "date/ws/bpe_16384.json", cale_stare = "lucru/w2_muon_B/gpt.pt", director_cache = "lucru/cache", samanta = 0, examene_suplimentare = ["fapte", "fapte_noi", "profesor"], validare_examene = "date/tinystories_r2/validare.txt", povesti_profesor = 40, hrana = "date/fapte/povesti.txt", fractie_hrana = 0.05, conversatie = "date/conversatie/text_v3/antrenare.jsonl", fractie_conversatie = 0.45, durata_scaderii_secunde = 7200, adunare_loturi = 8, racire_finala = 0.25, optimizator = "muon", rata_muon = 0.01 }

[antrenare_lunga]
eticheta = "S31 B: muon"

[porturi.date]
modul = "module.date_amestec:DateAmestec"
setari = { cale_antrenare = "date/ws/amestec/antrenare.txt", cale_validare = "date/tinystories_r2/validare.txt" }

[porturi.examen]
modul = "module.examen_bpb:ExamenBpb"

[porturi.cercetator]
modul = "module.cercetator_local:CercetatorLocal"
setari = { amesteca = false, strangere = false, spatiu = { model = { lot = [12] } } }

[porturi.profesor]
modul = "module.jucarii:ProfesorGol"

[porturi.rulare]
modul = "module.rulare_locala:RulareLocala"

[porturi.stocare]
modul = "module.stocare_disc:StocareDisc"
setari = { director = "lucru/stocare" }

[porturi.interfata]
modul = "module.interfata_consola:InterfataConsola"

[porturi.traducere]
modul = "module.jucarii:TraducereIdentitate"

[porturi.memorie]
modul = "module.jucarii:MemorieGoala"
