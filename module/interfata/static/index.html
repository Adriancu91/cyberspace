<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberspace: chat cu Kronos</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<header>
  <h1>Cyberspace</h1>
  <p id="cine">Răspunde: …</p>
</header>

<section id="zona-module" aria-label="Module">
  <h2>Module <span id="configurare"></span></h2>
  <div id="module"></div>
  <p id="detalii-modul" hidden></p>
</section>

<nav id="file" aria-label="File" hidden>
  <button type="button" id="fila-chat" class="aleasa" aria-pressed="true">Chat</button>
  <button type="button" id="fila-text" aria-pressed="false">Întreabă din text</button>
</nav>

<main id="zona-chat">
  <aside aria-label="Conversații">
    <button type="button" id="conversatie-noua">Conversație nouă</button>
    <ul id="conversatii"></ul>
  </aside>

  <section id="chat" aria-label="Chat">
    <p id="ce-stie">Ce știe modelul de acum: engleză simplă și povești pentru copii. Continuă textul pe care i-l scrii; încă nu răspunde la întrebări. Scrie-i începutul unei povești, în engleză.</p>
    <div id="mesaje" aria-live="polite"></div>
    <p id="anunt" role="status"></p>
    <form id="formular">
      <label for="text">Scrie-i lui Kronos</label>
      <textarea id="text" rows="3" placeholder="Scrie aici și apasă Trimite (sau Ctrl+Enter)"></textarea>
      <button type="submit" id="trimite">Trimite</button>
    </form>
  </section>
</main>

<section id="zona-text" aria-label="Întreabă din text" hidden>
  <form id="formular-text">
    <label for="paragraf">Paragraful (Kronos răspunde doar din el)</label>
    <textarea id="paragraf" rows="10" placeholder="Lipește aici un paragraf"></textarea>
    <label for="intrebare">Întrebarea</label>
    <textarea id="intrebare" rows="2" placeholder="Ce vrei să afli din paragraf? (Ctrl+Enter trimite)"></textarea>
    <button type="submit" id="intreaba">Întreabă</button>
  </form>
  <p id="anunt-text" role="status"></p>
  <article id="raspuns-text" class="mesaj creier" aria-live="polite" hidden>
    <p class="text" id="raspuns-text-continut"></p>
    <p class="autor" id="raspuns-text-eticheta"></p>
  </article>
</section>

<noscript>Pagina are nevoie de JavaScript ca să meargă.</noscript>
<script src="aplicatie.js"></script>
</body>
</html>
