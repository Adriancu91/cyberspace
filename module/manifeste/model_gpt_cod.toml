# Scris de unelte/module_toml.py din MANIFEST-ul clasei; „descriere”, [depinde] și [ofera] se păstrează.
[modul]
nume = "model_gpt_cod"
proiect = "kronos"
versiune = "0.2.0"
descriere = "GPT-ul Kronos-Cod (S59): ca model_muon, dar ia direct simbolurile gata făcute ale datelor de cod, fără tokenizare"
format = "modul-v0"

[contract]
port = "model"
versiune_contract = "1"

[depinde]
"model_gpt_conversatie_muon" = ">=0.1.0"

[ofera]
"antreneaza" = "antrenează cel mult un buget de secunde și întoarce statistici"
"biti_pentru" = "câți biți îi trebuie ca să ghicească un text (mai puțin = mai bine)"
"genereaza" = "continuă un text cu exact atâtea caractere câte se cer"
"salveaza" = "salvează modelul și întoarce calea fișierului"
"incarca" = "readuce un model salvat"

[rulare]
limbaj = "python"
intrare = "module.model_gpt_cod:ModelGPTCod"
teste = "python -m pytest teste/test_model_gpt_cod.py && python -m pytest teste_contracte -k ModelGPTCod"
