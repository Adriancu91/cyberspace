# Scris de unelte/module_toml.py din MANIFEST-ul clasei; „descriere”, [depinde] și [ofera] se păstrează.
[modul]
nume = "model_plasa_adaptiva"
proiect = "kronos"
versiune = "0.1.0"
descriere = "Plasa adaptivă: un nod pe raft al bibliotecii, cu legături care se întăresc sau slăbesc după examene."
format = "modul-v0"

[contract]
port = "model"
versiune_contract = "1"

[depinde]
"model_gpt" = ">=0.7.0"
"model_plasa" = ">=0.1.0"

[ofera]
"antreneaza" = "antrenează cel mult un buget de secunde și întoarce statistici"
"biti_pentru" = "câți biți îi trebuie ca să ghicească un text (mai puțin = mai bine)"
"genereaza" = "continuă un text cu exact atâtea caractere câte se cer"
"salveaza" = "salvează modelul și întoarce calea fișierului"
"incarca" = "readuce un model salvat"

[rulare]
limbaj = "python"
intrare = "module.model_plasa_adaptiva:ModelPlasaAdaptiva"
teste = "python -m pytest teste/test_model_plasa_adaptiva.py && python -m pytest teste_contracte -k ModelPlasaAdaptiva"
