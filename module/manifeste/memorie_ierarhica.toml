# Scris de unelte/module_toml.py din MANIFEST-ul clasei; „descriere”, [depinde] și [ofera] se păstrează.
[modul]
nume = "memorie_ierarhica"
proiect = "kronos"
versiune = "0.4.0"
descriere = "Biblioteca de sensuri: fiecare cuvânt are un cod pe niveluri, cu relații între sensuri și o plasă."
format = "modul-v0"

[contract]
port = "memorie"
versiune_contract = "1"

[depinde]

[ofera]
"caracteristici" = "codul ultimului cuvânt terminat, pentru fiecare literă"
"cod" = "locul unui cuvânt în bibliotecă, pe niveluri"
"cauta" = "sensurile unui cuvânt, pentru oameni"
"nivele" = "câte niveluri are codul"
"statistici" = "cifrele bibliotecii"

[rulare]
limbaj = "python"
intrare = "module.memorie_ierarhica:MemorieIerarhica"
teste = "python -m pytest teste_contracte -k MemorieIerarhica"
