# Scris de unelte/module_toml.py din MANIFEST-ul clasei; „descriere”, [depinde] și [ofera] se păstrează.
[modul]
nume = "date_fisier"
proiect = "kronos"
versiune = "0.1.0"
descriere = "Date dintr-un fișier text, cu ultima parte păstrată doar pentru examen."
format = "modul-v0"

[contract]
port = "date"
versiune_contract = "1"

[depinde]

[ofera]
"text_antrenare" = "textul de antrenare, mereu același"
"text_validare" = "textul de validare, nefolosit la antrenare"

[rulare]
limbaj = "python"
intrare = "module.date_fisier:DateFisier"
teste = "python -m pytest teste_contracte -k DateFisier"
