# Scris de unelte/module_toml.py din MANIFEST-ul clasei; „descriere”, [depinde] și [ofera] se păstrează.
[modul]
nume = "model_portar"
proiect = "kronos"
versiune = "0.1.0"
descriere = "GPT-ul S135 (0) cu „portar” (S139, amestecul de adâncimi): la straturile alese un selector liniar lasă doar ~jumătate din simboluri prin strat (top-k la antrenare + BCE; sigmoid(r) > 0,5, cauzal, la examene și la scris)"
format = "modul-v0"

[contract]
port = "model"
versiune_contract = "1"

[depinde]
"model_trepte" = ">=0.1.0"

[ofera]
"antreneaza" = "antrenează cel mult un buget de secunde și întoarce statistici"
"biti_pentru" = "câți biți îi trebuie ca să ghicească un text (mai puțin = mai bine)"
"genereaza" = "continuă un text cu exact atâtea caractere câte se cer"
"salveaza" = "salvează modelul și întoarce calea fișierului"
"incarca" = "readuce un model salvat"

[rulare]
limbaj = "python"
intrare = "module.model_portar:ModelPortar"
teste = "python -m pytest teste_contracte -k ModelPortar"
