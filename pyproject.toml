[project]
name = "platforma-ai"
version = "0.1.0"
description = "Platformă AI construită de la 0: nucleu mic + module înlocuibile + buclă de auto-îmbunătățire"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
teste = ["pytest>=8"]
# PyTorch se instalează separat, cu comanda de pe pytorch.org (varianta CUDA). Vezi README.

[project.scripts]
platforma = "nucleu.cli:main"

[tool.setuptools.packages.find]
include = ["nucleu*", "module*"]

[tool.pytest.ini_options]
testpaths = ["teste", "teste_contracte"]
pythonpath = ["."]
addopts = "-q"
