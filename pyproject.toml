[project]
name = "cyberspace"
version = "0.1.0"
description = "Platformă AI construită de la 0: nucleul Kronos + module înlocuibile + buclă de auto-îmbunătățire"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
teste = ["pytest>=8"]
# Profesorul (module/profesor_qwen.py): Qwen3-4B-Instruct-2507 în 4 biți, pe placa video. Toate din PyPI, gata făcute
# pentru Windows; folosesc PyTorch-ul cu CUDA deja instalat. Modelul (~8 GB) se descarcă de pe Hugging Face la prima folosire.
profesor = ["transformers>=5", "accelerate>=1", "bitsandbytes>=0.45"]
# PyTorch se instalează separat, cu comanda de pe pytorch.org (varianta CUDA). Vezi README.

[project.scripts]
kronos = "kronos.cli:main"

[tool.setuptools.packages.find]
include = ["kronos*", "module*"]

[tool.pytest.ini_options]
testpaths = ["teste", "teste_contracte"]
pythonpath = ["."]
addopts = "-q --basetemp=lucru/teste_tmp"
